# pyproject.toml
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-harness"
version = "0.1.0"
description = "Residency-aware local multi-agent CLI harness for llama-server and strata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85.0",
    "rich>=13.9.0",
    "httpx>=0.27.2",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "mcp>=1.1.0",
    "gitpython>=3.1.43",
]

[project.scripts]
atlas = "atlas.__main__:main"
